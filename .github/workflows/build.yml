name: build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descargar del repositorio
        uses: actions/checkout@v4

      - name: Compilar y empaquetar
        run: mvn --batch-mode -DskipTests package

      - name: Ejecutar pruebas
        run: mvn --batch-mode test
        env:
          JAVA_TOOL_OPTIONS: -Dnexteventux.home=${{ runner.temp }}

      - name: Resumen de cobertura JaCoCo
        uses: jjmrocha/jacoco-summary@v1.1.1
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv

      - name: Reporte JaCoCo independiente
        uses: PavanMudigonda/jacoco-reporter@v5.2.1
        with:
          coverage_results_path: target/site/jacoco/jacoco.xml
          coverage_report_name: JaCoCo Coverage Report
          coverage_report_title: JaCoCo Coverage Report
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_check_run: false
          publish_only_summary: true

      - name: Reporte de pruebas
        if: success() || failure()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: target/surefire-reports/TEST-*.xml

      - name: Reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn
